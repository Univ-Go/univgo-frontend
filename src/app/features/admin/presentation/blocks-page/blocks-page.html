<header class="intro">
  <div class="intro__text">
    <h1 i18n="@@admin.blocks.title">Consulta de bloques</h1>
    <p class="intro__lead" i18n="@@admin.blocks.lead">Gestión de reservas y aforo por horario.</p>
  </div>
  <button
    tuiButton
    type="button"
    appearance="outline"
    size="m"
    iconStart="@tui.file-down"
    [disabled]="exporting()"
    (click)="exportReport()"
  >
    <tui-loader [loading]="exporting()" [inheritColor]="true" [overlay]="true">
      <span i18n="@@admin.blocks.downloadReport">Descargar reporte</span>
    </tui-loader>
  </button>
</header>

<app-block-week-grid
  [days]="weekDays()"
  [summaries]="daySummaries()"
  [now]="now"
  [selectedDay]="selectedDay()"
  [loading]="summary.isLoading()"
  [error]="summary.error()"
  (daySelected)="selectDay($event)"
  (retry)="summary.reload()"
/>

<app-block-day-schedule
  [blocks]="blocks()"
  [now]="now"
  [day]="dayParam()"
  [loading]="schedule.isLoading()"
  [error]="schedule.error()"
  (retry)="schedule.reload()"
/>
