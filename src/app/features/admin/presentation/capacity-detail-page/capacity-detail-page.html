<div class="page-nav">
  <a
    tuiButton
    type="button"
    appearance="flat"
    size="m"
    iconStart="@tui.arrow-left"
    [routerLink]="['/admin', spaceId(), 'blocks']"
    [queryParams]="listParams()"
    i18n="@@common.back"
    >Volver</a
  >

  <!-- `tui-breadcrumbs` renders a plain flex container, so the landmark and its accessible name are
       ours to provide. It also sets `white-space: nowrap`: on a phone the trail would overflow the
       layout gutter, and the back button already carries the same parent, so it starts at tablet. -->
  <nav
    class="page-nav__trail"
    i18n-aria-label="@@navigation.breadcrumbLabel"
    aria-label="Ruta de navegación"
  >
    <tui-breadcrumbs>
      <a
        *tuiItem
        tuiLink
        [routerLink]="['/admin', spaceId(), 'blocks']"
        [queryParams]="listParams()"
        i18n="@@admin.blocks.title"
        >Consulta de bloques</a
      >
      <span *tuiItem class="page-nav__current" aria-current="page" i18n="@@admin.capacity.title"
        >Aforo</span
      >
    </tui-breadcrumbs>
  </nav>
</div>

@if (loading()) {
  <div
    class="detail__loading"
    aria-busy="true"
    i18n-aria-label="@@admin.capacity.loading"
    aria-label="Cargando el bloque"
  >
    <span class="detail__loading-block" [tuiSkeleton]="true"></span>
    <span class="detail__loading-block" [tuiSkeleton]="true"></span>
  </div>
} @else if (failed()) {
  <app-empty-state
    icon="@tui.wifi-off"
    i18n-heading="@@admin.capacity.error.heading"
    heading="No pudimos cargar este bloque"
    i18n-description="@@spaces.error.description"
    description="Revisa tu conexión e inténtalo de nuevo. Si sigue fallando, prueba en unos minutos."
  >
    <button
      tuiButton
      type="button"
      size="m"
      appearance="outline"
      iconStart="@tui.refresh-cw"
      (click)="retry()"
      i18n="@@spaces.error.retry"
    >
      Reintentar
    </button>
  </app-empty-state>
} @else if (current(); as block) {
  <header class="intro">
    <div class="intro__text">
      <h1 i18n="@@admin.capacity.title">Aforo</h1>

      <!-- The switcher replaced what used to be plain text: which block this is, is the one thing
           the heading no longer gets to assume now that it can change without leaving the view. -->
      <p class="intro__lead">
        <app-block-switcher
          [blocks]="blocksForDay()"
          [selectedStart]="block.start.getTime()"
          (blockSelected)="selectBlock($event)"
        />
        <span class="intro__dot" aria-hidden="true"></span>
        <span>{{ spaceName() }}</span>
      </p>
    </div>
  </header>

  @if (load(); as load) {
    <div class="summary">
      <app-occupancy-card class="summary__hero" [occupancy]="load" />

      @if (tally(); as tally) {
        <div class="summary__chips">
          <app-metric-card
            align="center"
            iconSize="l"
            icon="@tui.circle-check"
            tone="positive"
            i18n-heading="@@admin.capacity.inRoom.title"
            heading="En sala"
            [value]="tally.inRoom"
          >
            <ng-container i18n="@@admin.capacity.inRoom.hint"
              >de {{ load.occupied }} cupos ocupados</ng-container
            >
          </app-metric-card>

          <app-metric-card
            align="center"
            iconSize="l"
            icon="@tui.hourglass"
            tone="warning"
            i18n-heading="@@admin.capacity.pending.title"
            heading="Pendientes"
            [value]="tally.pending"
          >
            <ng-container i18n="@@admin.capacity.pending.hint"
              >todavía sin registrar su entrada</ng-container
            >
          </app-metric-card>
        </div>
      }
    </div>
  }

  <app-attendee-roster [attendees]="block.attendees" [query]="query()" />
} @else {
  <app-empty-state
    icon="@tui.calendar-x"
    i18n-heading="@@admin.capacity.notFound.title"
    heading="Bloque no encontrado"
    i18n-description="@@admin.capacity.notFound.description"
    description="Puede que el enlace sea incorrecto o que este espacio no abra a esa hora."
  />
}
