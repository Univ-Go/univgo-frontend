@switch (status()) {
  @case ('scheduled') {
    <span
      tuiBadge
      appearance="warning"
      [size]="size()"
      iconStart="@tui.clock"
      i18n="@@admin.closure.status.scheduled"
    >
      Programado
    </span>
  }
  @case ('active') {
    <span
      tuiBadge
      appearance="positive"
      [size]="size()"
      iconStart="@tui.circle-check"
      i18n="@@admin.closure.status.active"
    >
      En curso
    </span>
  }
  @case ('finished') {
    <span
      tuiBadge
      appearance="neutral"
      [size]="size()"
      iconStart="@tui.history"
      i18n="@@admin.closure.status.completed"
    >
      Finalizado
    </span>
  }
  <!-- Reverted is not "finished": somebody reopened the space, and the reservations it had
       suspended went back to their owners. -->
  @case ('reverted') {
    <span
      tuiBadge
      appearance="neutral"
      [size]="size()"
      iconStart="@tui.rotate-ccw"
      i18n="@@admin.closure.status.reverted"
    >
      Revertido
    </span>
  }
}
