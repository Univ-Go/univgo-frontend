<button
  tuiButton
  type="button"
  appearance="outline"
  size="m"
  [id]="triggerId"
  iconStart="@tui.map-pin"
  iconEnd="@tui.chevron-down"
  [tuiDropdown]="panel"
  [(tuiDropdownOpen)]="open"
  [attr.aria-label]="switcherLabel + ': ' + current()?.spaceName"
>
  {{ current()?.spaceName }}
</button>

<ng-template #panel>
  <tui-data-list [attr.aria-labelledby]="triggerId">
    @for (space of spaces(); track space.spaceId) {
      <button
        tuiOption
        type="button"
        [iconEnd]="space.spaceId === selectedId() ? '@tui.check' : null"
        [attr.aria-selected]="space.spaceId === selectedId() ? 'true' : null"
        (click)="select(space.spaceId)"
      >
        {{ space.spaceName }}
      </button>
    }

    <!-- Below the spaces rather than among them: this leaves the picker entirely, for the grid
         where there is no "current" space to be one of these options. -->
    <a
      tuiOption
      class="panel__all"
      routerLink="/admin/spaces"
      iconStart="@tui.layout-grid"
      (click)="open.set(false)"
      i18n="@@admin.spaceSwitcher.viewAll"
      >Ver todos los espacios</a
    >
  </tui-data-list>
</ng-template>
