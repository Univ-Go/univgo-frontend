<header class="intro">
  <h1 i18n="@@admin.spaceWizard.schedules.title">¿Cuándo abre?</h1>
  <p class="intro__lead" i18n="@@admin.spaceWizard.schedules.lead">
    Las franjas de cada día se parten en bloques reservables. Un día sin franjas queda cerrado.
  </p>
</header>

<app-space-schedule-editor [value]="draft.schedules()" (valueChange)="draft.setSchedules($event)" />

<div class="actions">
  <button
    tuiButton
    type="button"
    size="m"
    appearance="outline"
    iconStart="@tui.arrow-left"
    (click)="back()"
    i18n="@@admin.spaceWizard.back"
  >
    Atrás
  </button>

  <button
    tuiButton
    type="button"
    size="m"
    appearance="primary"
    iconEnd="@tui.arrow-right"
    [disabled]="!valid()"
    (click)="continue()"
    i18n="@@admin.spaceWizard.continue"
  >
    Continuar
  </button>
</div>
