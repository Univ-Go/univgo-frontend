<h1 i18n="@@reservations.title">Mis reservas</h1>

<section class="filters">
  <!-- Teal marks a filter that is narrowing the list: it is the palette's "in effect" colour, and
       the check icon repeats the state without relying on colour (WCAG 1.4.1). -->
  <button
    tuiButton
    type="button"
    size="m"
    [appearance]="statusFilterActive() ? 'accent' : 'outline'"
    [iconStart]="statusFilterActive() ? '@tui.check' : null"
    iconEnd="@tui.chevron-down"
    class="filters__trigger"
    id="status-filter"
    [tuiDropdown]="statusPanel"
    [(tuiDropdownOpen)]="statusFilterOpen"
    i18n="@@reservations.filters.status.label"
  >
    Estado
  </button>

  <button
    tuiButton
    type="button"
    size="m"
    [appearance]="categoryFilterActive() ? 'accent' : 'outline'"
    [iconStart]="categoryFilterActive() ? '@tui.check' : null"
    iconEnd="@tui.chevron-down"
    class="filters__trigger"
    id="category-filter"
    [tuiDropdown]="categoryPanel"
    [(tuiDropdownOpen)]="categoryFilterOpen"
    i18n="@@reservations.filters.category.label"
  >
    Tipo de espacio
  </button>

  <button
    tuiButton
    type="button"
    size="m"
    [appearance]="dateFilterActive() ? 'accent' : 'outline'"
    [iconStart]="dateFilterActive() ? '@tui.check' : null"
    iconEnd="@tui.chevron-down"
    class="filters__trigger"
    id="date-filter"
    [tuiDropdown]="datePanel"
    [(tuiDropdownOpen)]="dateFilterOpen"
    i18n="@@reservations.filters.date.label"
  >
    Fecha
  </button>
</section>

<ng-template #statusPanel>
  <!-- A `fieldset` with no name is an anonymous group to a screen reader. The name comes from the
       trigger that opened the panel rather than from a `legend`: it is the same word, already
       translated and already on screen, so nothing has to be kept in step with it. -->
  <fieldset class="filters__panel" aria-labelledby="status-filter">
    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedStatuses().has('upcoming')"
        (ngModelChange)="toggleStatus('upcoming', $event)"
      />
      <span i18n="@@reservations.filters.status.upcoming">Próximas</span>
    </label>

    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedStatuses().has('ongoing')"
        (ngModelChange)="toggleStatus('ongoing', $event)"
      />
      <span i18n="@@reservations.filters.status.ongoing">Actuales</span>
    </label>

    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedStatuses().has('past')"
        (ngModelChange)="toggleStatus('past', $event)"
      />
      <span i18n="@@reservations.filters.status.past">Pasadas</span>
    </label>
  </fieldset>
</ng-template>

<ng-template #categoryPanel>
  <fieldset class="filters__panel" aria-labelledby="category-filter">
    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedCategories().has('sports')"
        (ngModelChange)="toggleCategory('sports', $event)"
      />
      <span i18n="@@reservations.filters.category.sports">Deportes</span>
    </label>

    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedCategories().has('study')"
        (ngModelChange)="toggleCategory('study', $event)"
      />
      <span i18n="@@reservations.filters.category.study">Estudio</span>
    </label>

    <label tuiBlock>
      <input
        type="checkbox"
        tuiCheckbox
        [ngModel]="selectedCategories().has('lab')"
        (ngModelChange)="toggleCategory('lab', $event)"
      />
      <span i18n="@@reservations.filters.category.lab">Laboratorios</span>
    </label>
  </fieldset>
</ng-template>

<ng-template #datePanel>
  <fieldset class="filters__panel" aria-labelledby="date-filter">
    <tui-calendar-range [value]="selectedRange()" (valueChange)="setSelectedRange($event)" />

    @if (selectedRange()) {
      <button
        tuiLink
        type="button"
        (click)="setSelectedRange(null)"
        i18n="@@reservations.filters.date.clear"
      >
        Quitar filtro
      </button>
    }
  </fieldset>
</ng-template>

<section class="results">
  @let found = filteredReservations().length;

  @if (pagedReservations().length > 0) {
    <!-- Also the missing level between the page title and each card's `h3`, so the outline never
         skips a step. The plural sits in an inline element for the same reason it does in the
         catalogue: a block one lets the formatter pad it and Angular extracts a second, unnamed
         ICU unit. -->
    <h2 class="results__count">
      <span i18n="@@reservations.results.count">{found, plural,
        =1 {1 reserva}
        other {{{found}} reservas}
      }</span>
    </h2>

    <ul class="reservations">
      @for (reservation of pagedReservations(); track reservation.id) {
        <li class="reservations__item">
          <app-reservation-card [reservation]="reservation" />
        </li>
      }
    </ul>
  } @else {
    <app-empty-state
      icon="@tui.filter-x"
      i18n-heading="@@reservations.empty.title"
      heading="No hay reservas con estos filtros"
      i18n-description="@@reservations.empty.description"
      description="Prueba a cambiar los filtros para ver otras reservas."
    />
  }

  <!-- Nothing to page through with a single page, and paging an empty result is meaningless. -->
  @if (pageCount() > 1) {
    <tui-pagination [length]="pageCount()" [(index)]="pageIndex" />
  }
</section>
