<section class="mx-auto max-w-xl py-10 text-center">
  <p class="text-sm font-semibold text-primary" i18n="@@notFound.code">Error 404</p>

  <h1
    class="mt-2 text-3xl font-bold tracking-tight text-balance text-surface-900 dark:text-surface-0"
    i18n="@@notFound.title"
  >
    No hemos encontrado esta página
  </h1>

  <p
    class="mt-4 text-base text-pretty text-surface-600 dark:text-surface-300"
    i18n="@@notFound.detail"
  >
    Es posible que el enlace haya cambiado o que la página ya no esté disponible.
  </p>

  <a routerLink="/" pButton class="mt-8 inline-flex" [attr.aria-label]="backToHomeLabel">
    <i class="pi pi-arrow-left" aria-hidden="true"></i>
    {{ backToHomeLabel }}
  </a>
</section>
