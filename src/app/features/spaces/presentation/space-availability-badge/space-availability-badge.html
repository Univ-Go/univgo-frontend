@switch (availability().kind) {
  @case ('free') {
    <span
      tuiBadge
      appearance="positive"
      [size]="size()"
      iconStart="@tui.circle-check"
      i18n="@@spaces.availability.free"
    >
      Disponible
    </span>
  }
  @case ('later') {
    <span
      tuiBadge
      appearance="warning"
      [size]="size()"
      iconStart="@tui.clock"
      i18n="@@spaces.availability.later"
    >
      Libre desde {{ nextTime() }}
    </span>
  }
  <!-- Three ways of having nothing free, and they are not the same news: one is other students
       having got there first, one is a decision somebody made, and one is the timetable. The icons
       are plain shapes on purpose — at badge size a detailed glyph is a smudge. -->
  @case ('full') {
    <span
      tuiBadge
      appearance="neutral"
      [size]="size()"
      iconStart="@tui.users"
      i18n="@@spaces.availability.full"
    >
      Completo
    </span>
  }
  @case ('closed') {
    <span
      tuiBadge
      appearance="negative"
      [size]="size()"
      iconStart="@tui.lock"
      i18n="@@spaces.availability.closed"
    >
      Cerrado
    </span>
  }
  @case ('notOpen') {
    <span
      tuiBadge
      appearance="neutral"
      [size]="size()"
      iconStart="@tui.ban"
      i18n="@@spaces.availability.notOpen"
    >
      No abre este día
    </span>
  }
}
