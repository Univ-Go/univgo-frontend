@let space = listed().space;

<article
  tuiCardLarge
  tuiSurface
  tuiAppearance="outline"
  class="card"
  [class.card--chosen]="chosen()"
>
  <app-media-plate [icon]="icon()">
    <app-space-availability-badge [availability]="listed().availability" />
  </app-media-plate>

  <div class="card__body">
    <h3 class="card__name">{{ space.name }}</h3>

    <dl class="card__facts">
      <div class="fact">
        <dt i18n="@@spaces.card.capacity">Capacidad</dt>
        <dd>
          <tui-icon icon="@tui.users" aria-hidden="true" />
          <span i18n="@@spaces.card.capacityValue">{listed().space.capacity, plural,
            =1 {1 persona}
            other {{{space.capacity}} personas}
          }</span>
        </dd>
      </div>
      <div class="fact">
        <dt i18n="@@reservation.factLocation">Ubicación</dt>
        <dd><tui-icon icon="@tui.map-pin" aria-hidden="true" />{{ space.location }}</dd>
      </div>
    </dl>
  </div>

  @if (bookable() && choosing) {
    <!-- `aria-pressed` rather than a second label: the button keeps one accessible name and
         announces whether this card is the one currently picked. -->
    <button
      tuiButton
      type="button"
      size="m"
      class="card__action"
      [appearance]="chosen() ? 'primary' : 'outline'"
      [iconStart]="chosen() ? '@tui.check' : ''"
      [attr.aria-pressed]="chosen()"
      (click)="choose()"
    >
      {{ chosen() ? chosenLabel : chooseLabel }}
    </button>
  } @else if (bookable()) {
    <a
      tuiButton
      [routerLink]="['/book', space.id, 'when']"
      size="m"
      appearance="primary"
      iconEnd="@tui.arrow-right"
      class="card__action"
      i18n="@@spaces.card.book"
    >
      Reservar
    </a>
  } @else if (closed()) {
    <button
      tuiButton
      type="button"
      size="m"
      appearance="outline"
      class="card__action"
      disabled
      i18n="@@spaces.card.unavailable"
    >
      No disponible
    </button>
  } @else {
    <button
      tuiButton
      type="button"
      size="m"
      appearance="outline"
      iconStart="@tui.calendar-search"
      class="card__action"
      i18n="@@spaces.card.viewSchedule"
    >
      Ver horarios
    </button>
  }
</article>
