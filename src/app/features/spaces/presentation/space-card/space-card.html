@let space = listed().space;

<article
  tuiCardLarge
  tuiSurface
  tuiAppearance="outline"
  class="card"
  [class.card--chosen]="chosen()"
>
  <app-media-plate [icon]="icon()" [imageUrl]="coverImage()">
    <app-space-availability-badge [availability]="listed().availability" />
  </app-media-plate>

  <div class="card__body">
    <h3 class="card__name">
      <!-- Outside the booking flow the whole card opens the space, and the link inside the heading
           is what makes that reachable by keyboard and announceable by name — the overlay in the
           stylesheet only extends its hit area. Inside the flow there is no link: the card's job
           there is to be picked, and a second destination would compete with it. -->
      @if (detailLink(); as link) {
        <a class="card__link" [routerLink]="link">{{ space.name }}</a>
      } @else {
        {{ space.name }}
      }
    </h3>

    <dl class="card__facts">
      <div class="fact">
        <dt i18n="@@spaces.card.capacity">Capacidad</dt>
        <dd>
          <tui-icon icon="@tui.users" aria-hidden="true" />
          <span i18n="@@spaces.card.capacityValue">{listed().space.capacity, plural,
            =1 {1 persona}
            other {{{space.capacity}} personas}
          }</span>
        </dd>
      </div>
      <div class="fact">
        <dt i18n="@@reservation.factLocation">Ubicación</dt>
        <dd><tui-icon icon="@tui.map-pin" aria-hidden="true" />{{ space.location }}</dd>
      </div>
    </dl>
  </div>

  @if (bookable() && choosing) {
    <!-- `aria-pressed` rather than a second label: the button keeps one accessible name and
         announces whether this card is the one currently picked. -->
    <button
      tuiButton
      type="button"
      size="m"
      class="card__action"
      [appearance]="chosen() ? 'primary' : 'outline'"
      [iconStart]="chosen() ? '@tui.check' : ''"
      [attr.aria-pressed]="chosen()"
      (click)="choose()"
    >
      {{ chosen() ? chosenLabel : chooseLabel }}
    </button>
  } @else {
    <app-space-book-action
      class="card__action"
      [spaceId]="space.id"
      [availability]="listed().availability"
    />
  }
</article>
