@let space = listed().space;

<article tuiCardLarge tuiSurface tuiAppearance="outline" class="card">
  <app-media-plate [icon]="icon()">
    <app-space-availability-badge [availability]="listed().availability" />
  </app-media-plate>

  <div class="card__body">
    <h3 class="card__name">{{ space.name }}</h3>

    <dl class="card__facts">
      <div class="fact">
        <dt i18n="@@spaces.card.capacity">Capacidad</dt>
        <dd>
          <tui-icon icon="@tui.users" aria-hidden="true" />
          <span i18n="@@spaces.card.capacityValue">{listed().space.capacity, plural,
            =1 {1 persona}
            other {{{space.capacity}} personas}
          }</span>
        </dd>
      </div>
      <div class="fact">
        <dt i18n="@@reservation.factLocation">Ubicación</dt>
        <dd><tui-icon icon="@tui.map-pin" aria-hidden="true" />{{ space.location }}</dd>
      </div>
    </dl>
  </div>

  <!-- TEMPORARY: the booking flow does not exist yet, so the action stays a plain button. It gains
       its route when the reservation steps ship. -->
  @if (bookable()) {
    <button
      tuiButton
      type="button"
      size="m"
      appearance="primary"
      iconEnd="@tui.arrow-right"
      class="card__action"
      i18n="@@spaces.card.book"
    >
      Reservar
    </button>
  } @else if (closed()) {
    <button
      tuiButton
      type="button"
      size="m"
      appearance="outline"
      class="card__action"
      disabled
      i18n="@@spaces.card.unavailable"
    >
      No disponible
    </button>
  } @else {
    <button
      tuiButton
      type="button"
      size="m"
      appearance="outline"
      iconStart="@tui.calendar-search"
      class="card__action"
      i18n="@@spaces.card.viewSchedule"
    >
      Ver horarios
    </button>
  }
</article>
