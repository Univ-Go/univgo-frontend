<header class="header">
  <!-- The wordmark gives way to the isotype on a phone: with the utilities and the account beside
       it, a mark three times as wide does not share a 320px line. Both are in the markup and the
       stylesheet picks, the same swap the panel's bar makes. -->
  <a class="logo" routerLink="/home">
    <app-brand-logo />
    <app-brand-isotype />
  </a>

  <nav class="nav" i18n-aria-label="@@navigation.mainLabel" aria-label="Navegación principal">
    <a
      tuiLink
      routerLink="/home"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav__item"
      i18n="@@navigation.home"
      >Inicio</a
    >
    <a
      tuiLink
      routerLink="/spaces"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="spacesLinkOptions"
      class="nav__item"
      i18n="@@navigation.spaces"
      >Espacios</a
    >
    <a
      tuiLink
      routerLink="/reservations"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav__item"
      i18n="@@navigation.reservations"
      >Mis Reservas</a
    >
  </nav>

  <!-- No notification bell: there is nothing behind one, and the room it took is what lets the
       utilities and the account stay here at every width instead of moving into the tab bar on a
       phone. The bar below is destinations only, the same shape the panel's is. -->
  <div class="actions">
    <app-language-selector />
    <app-theme-toggle />

    <button
      tuiAvatar
      type="button"
      size="m"
      appearance="primary"
      class="profile"
      i18n-aria-label="@@navigation.accountMenu"
      aria-label="Tu cuenta"
      [tuiDropdown]="accountMenu"
      [(tuiDropdownOpen)]="menuOpen"
    >
      {{ initials() }}
    </button>
  </div>
</header>

<ng-template #accountMenu>
  <app-account-menu />
</ng-template>
