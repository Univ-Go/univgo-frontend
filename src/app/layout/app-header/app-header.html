<header class="header">
  <a class="logo" routerLink="/home">
    <img src="images/UnivGo_logo.png" alt="UnivGo" width="1867" height="564" />
  </a>

  <nav class="nav" i18n-aria-label="@@navigation.mainLabel" aria-label="Navegación principal">
    <a
      tuiLink
      routerLink="/home"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav__item"
      i18n="@@navigation.home"
      >Inicio</a
    >
    <a
      tuiLink
      routerLink="/spaces"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="spacesLinkOptions"
      class="nav__item"
      i18n="@@navigation.spaces"
      >Espacios</a
    >
    <a
      tuiLink
      routerLink="/reservations"
      routerLinkActive="nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav__item"
      i18n="@@navigation.reservations"
      >Mis Reservas</a
    >
  </nav>

  <div class="actions">
    <!-- Notifications stay in the bar at every size: a pending alert nobody can see is pointless. -->
    <tui-badged-content>
      <tui-badge-notification tuiSlot="top" size="s" />
      <button
        tuiIconButton
        type="button"
        appearance="flat"
        size="s"
        iconStart="@tui.bell"
        i18n-aria-label="@@navigation.notifications"
        aria-label="Notificaciones"
      ></button>
    </tui-badged-content>

    <!-- On a phone the utilities and the account live in the tab bar, within reach of the thumb;
         rendering each control in exactly one place keeps it out of the accessibility tree twice. -->
    @if (!compact()) {
      <app-language-selector />
      <app-theme-toggle />

      <button
        tuiAvatar
        type="button"
        size="m"
        appearance="primary"
        class="profile"
        i18n-aria-label="@@navigation.accountMenu"
        aria-label="Tu cuenta"
        [tuiDropdown]="accountMenu"
        [(tuiDropdownOpen)]="menuOpen"
      >
        {{ initials }}
      </button>
    }
  </div>
</header>

<ng-template #accountMenu>
  <app-account-menu />
</ng-template>
