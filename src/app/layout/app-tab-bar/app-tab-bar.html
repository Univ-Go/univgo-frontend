<nav class="bar" i18n-aria-label="@@navigation.mainLabel" aria-label="Navegación principal">
  @if (admin()) {
    @for (item of adminItems; track item.label) {
      @if (adminSpaceId() && item.link; as link) {
        <a
          class="tab"
          [routerLink]="['/admin', adminSpaceId(), link]"
          routerLinkActive="tab--active"
          [routerLinkActiveOptions]="adminMatchOptions"
        >
          <tui-icon [icon]="item.icon" aria-hidden="true" />
          <span>{{ item.compactLabel ?? item.label }}</span>
        </a>
      } @else {
        <button type="button" class="tab" disabled>
          <tui-icon [icon]="item.icon" aria-hidden="true" />
          <span>{{ item.compactLabel ?? item.label }}</span>
        </button>
      }
    }
  } @else {
    <a
      class="tab"
      routerLink="/home"
      routerLinkActive="tab--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <tui-icon icon="@tui.house" aria-hidden="true" />
      <span i18n="@@navigation.home">Inicio</span>
    </a>

    <a
      class="tab"
      routerLink="/spaces"
      routerLinkActive="tab--active"
      [routerLinkActiveOptions]="spacesLinkOptions"
    >
      <tui-icon icon="@tui.layout-grid" aria-hidden="true" />
      <span i18n="@@navigation.spaces">Espacios</span>
    </a>

    <a
      class="tab"
      routerLink="/reservations"
      routerLinkActive="tab--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <tui-icon icon="@tui.calendar-days" aria-hidden="true" />
      <span i18n="@@navigation.reservations">Mis Reservas</span>
    </a>
  }
</nav>

<!-- Outside the bar, and outside its landmark: starting a booking is an action, not a destination,
     and a raised cell among an odd number of tabs can only sit off-centre, which reads as a mistake
     rather than as a decision. Floating over the bottom-right corner is where a thumb already
     expects the one thing a person repeats every day.

     It says what it does. A bare plus is a guess — and the alternative, opening a menu to name the
     single thing the button already is, adds a tap to reach an answer the label can just give. The
     word is the accessible name too, with no `aria-label` competing with it.

     The panel has no counterpart: booking on a student's behalf has no flow yet, and an inert
     control parked over the content would be the loudest thing on the screen. -->
@if (!admin() && quickAction()) {
  <a
    tuiButton
    routerLink="/book/space"
    appearance="primary"
    size="l"
    iconStart="@tui.plus"
    class="fab"
    i18n="@@navigation.newReservation"
    >Reservar</a
  >
}
