<a
  href="#main-content"
  class="sr-only rounded-(--radius-control) bg-primary px-4 py-2 text-primary-contrast focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-(--z-overlay)"
  >{{ skipToContentLabel }}</a
>

<div class="flex min-h-dvh flex-col">
  <app-header />

  <!-- tabindex allows the skip link to move focus here, not just the viewport. -->
  <main
    id="main-content"
    tabindex="-1"
    class="mx-auto w-full max-w-(--container-content) flex-1 px-4 py-8 sm:px-6 sm:py-10"
  >
    <router-outlet />
  </main>

  <app-footer />
</div>

<p-toast [breakpoints]="{ '640px': { width: '100%', right: '0', left: '0' } }" />
