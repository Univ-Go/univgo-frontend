<svg class="univgo-brand-artwork" width="588" height="563" viewBox="0 0 588 563" fill="none" xmlns="http://www.w3.org/2000/svg"><style>
  /* Two tiers: the `--univgo-logo-*` names are the overridable surface, the unprefixed ones are
     what the paths read. The variants derive from the two bases, so recolouring the mark takes two
     values and keeps its shading. Rationale in brand-palette.ts. */
  svg.univgo-brand-artwork {
    --primary: var(--univgo-logo-primary, #B40520);
    --secondary: var(--univgo-logo-secondary, #38B3AE);

    --primary-light: var(--univgo-logo-primary-light, #DD0F30);
    --primary-dark: var(--univgo-logo-primary-dark, #840017);
    --primary-darker: var(--univgo-logo-primary-darker, #6A020B);
    --secondary-light: var(--univgo-logo-secondary-light, #51C3BB);
    --secondary-dark: var(--univgo-logo-secondary-dark, #029D9D);
    --secondary-darker: var(--univgo-logo-secondary-darker, #026C6B);
  }

  @supports (color: oklch(from red l c h)) {
    svg.univgo-brand-artwork {
      --primary-light: var(
        --univgo-logo-primary-light,
        oklch(from var(--primary) calc(l * 1.1705) calc(c * 1.1549) h)
      );
      --primary-dark: var(
        --univgo-logo-primary-dark,
        oklch(from var(--primary) calc(l * 0.7948) calc(c * 0.8018) h)
      );
      --primary-darker: var(
        --univgo-logo-primary-darker,
        oklch(from var(--primary) calc(l * 0.6808) calc(c * 0.6811) h)
      );
      --secondary-light: var(
        --univgo-logo-secondary-light,
        oklch(from var(--secondary) calc(l * 1.0722) calc(c * 0.9782) h)
      );
      --secondary-dark: var(
        --univgo-logo-secondary-dark,
        oklch(from var(--secondary) calc(l * 0.9010) calc(c * 1.0152) h)
      );
      --secondary-darker: var(
        --univgo-logo-secondary-darker,
        oklch(from var(--secondary) calc(l * 0.6874) calc(c * 0.7736) h)
      );
    }
  }
</style>
