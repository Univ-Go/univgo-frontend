<!doctype html>
<!-- The i18n build rewrites `lang` (and `dir`) per locale. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Replaced per route by PageMetadataStrategy; kept here so the document is valid before boot. -->
    <title>UnivGo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#7f0013" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191c1d" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Relative to <base>, which the i18n build rewrites per locale. -->
    <link rel="preload" href="fonts/teachers-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
